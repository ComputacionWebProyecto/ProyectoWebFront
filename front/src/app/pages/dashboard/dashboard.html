<!-- dashboard.html -->
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <app-drop-menu [isOpen]="isSidebarOpen"></app-drop-menu>

  <!-- Contenido principal -->
  <div class="flex-1 flex flex-col">
    <!-- Header fijo -->
    <app-header-dashboard 
      [isSidebarOpen]="isSidebarOpen"
      (toggleSidebar)="toggleSidebar()">
    </app-header-dashboard>

    <!-- Contenido del dashboard con padding-top para compensar el header fijo -->
    <main class="flex-1 overflow-y-auto dashboard-container pt-16">
      <div class="w-full max-w-7xl mx-auto p-6">
        <!-- Tu contenido aquí -->
      
      </div>
    </main>
  </div>
</div>

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <app-drop-menu
    [isOpen]="isSidebarOpen"
    (componentSelected)="onComponentSelected($event)">
  </app-drop-menu>

  <!-- Contenido principal -->
  <div class="flex-1 flex flex-col">
    <!-- Header fijo -->
    <app-header-dashboard
      [isSidebarOpen]="isSidebarOpen"
      [currentProcessName]="currentProcessName"
      (toggleSidebar)="toggleSidebar()
      "
      (toggleProcesses)="toggleProcessPanel()"
      (toggleUsers)="toggleUserPanel()"
      (toggleRoles)="onToggleRoles()">
    </app-header-dashboard>

    <!-- Paneles laterales -->
    <app-user-panel [isOpen]="isUserPanelOpen"></app-user-panel>
    <app-process-panel [isOpen]="isProcessPanelOpen"></app-process-panel>
    <app-role-panel [isOpen]="isRolePanelOpen"></app-role-panel>

    <!-- Contenido -->
    <main class="flex-1 overflow-hidden pt-16">
      <!-- Área del tablero -->
      <div
        class="board-area dashboard-container h-full w-full relative overflow-hidden"
        [class.shift-active]="isShiftPressed"
        (drop)="onBoardDrop($event)"
        (dragover)="onBoardDragOver($event)">

        <!-- Controles de navegación y zoom (FIJOS en pantalla) -->
        <div class="fixed bottom-6 right-6 flex flex-col gap-3" style="z-index: 9999; width: 140px;">

          <!-- Indicador de coordenadas -->
          <div class="bg-white rounded-lg shadow-xl border-2 border-gray-300 px-3 py-2">
            <div class="flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-xs font-mono font-bold text-gray-800 whitespace-nowrap">
                ({{ getCurrentViewX() }}, {{ getCurrentViewY() }})
              </span>
            </div>
          </div>

          <!-- Botón Home -->
          <div class="bg-white rounded-lg shadow-xl border-2 border-gray-300 p-2">
            <button
              (click)="centerOnOrigin()"
              class="w-full h-12 flex items-center justify-center rounded-lg hover:bg-blue-50 transition-colors group"
              title="Volver al origen (0,0)">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            </button>
          </div>

          <!-- Controles de Zoom -->
          <div class="bg-white rounded-lg shadow-xl border-2 border-gray-300 p-2 flex flex-col gap-2">
            <!-- Zoom In -->
            <button
              (click)="zoomIn()"
              class="w-full h-10 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors"
              title="Ampliar (Ctrl + Scroll arriba)">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m6-6H6" />
              </svg>
            </button>

            <!-- Indicador de Zoom -->
            <div class="w-full h-8 flex items-center justify-center text-xs font-semibold text-gray-700 border-t border-b border-gray-200">
              {{ (zoomLevel * 100) | number:'1.0-0' }}%
            </div>

            <!-- Zoom Out -->
            <button
              (click)="zoomOut()"
              class="w-full h-10 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors"
              title="Reducir (Ctrl + Scroll abajo)">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H6" />
              </svg>
            </button>

            <!-- Reset -->
            <button
              (click)="resetZoom()"
              class="w-full h-8 flex items-center justify-center rounded-md hover:bg-blue-100 text-xs font-medium text-blue-600 hover:text-blue-700 transition-colors border-t border-gray-200"
              title="Resetear zoom a 100%">
              Reset
            </button>
          </div>
        </div>

        <!-- Canvas movible -->
        <div class="board-canvas" [style.transform]="getCanvasTransform()">

          <!-- Capa SVG: SOLO líneas de edges -->
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" aria-hidden="true">
            <defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z"></path>
              </marker>
            </defs>

            <g *ngFor="let edgeCmp of edgeComponents; trackBy: trackByEdge">
              <line
                *ngIf="edgeCoordsByComponent(edgeCmp) as c"
                [attr.x1]="c.x1" [attr.y1]="c.y1"
                [attr.x2]="c.x2" [attr.y2]="c.y2"
                stroke="#374151" stroke-width="2" stroke-opacity="0.9"
                marker-end="url(#arrow)">
              </line>
            </g>
          </svg>
          <!-- Fin capa SVG -->

          <!-- Componentes (NO renderizamos edges como nodos) -->
          <div
            *ngFor="let component of boardComponents; trackBy: trackByComponent"
            class="board-component absolute"
            [style.left.px]="component.x"
            [style.top.px]="component.y"
            [attr.data-type]="component.type"
            [attr.draggable]="true"
            (dragstart)="onComponentDragStart($event, component)"
            (dragend)="onComponentDragEnd($event)">

            <ng-container [ngSwitch]="component.category">
              <!-- GATEWAY -->
              <div *ngSwitchCase="'gateway'" class="gateway-container" (click)="openInspector('gateway', component)">
                <div class="gateway gateway-decision">
                  <svg width="60" height="60" viewBox="0 0 60 60">
                    <path d="M30 5 L55 30 L30 55 L5 30 Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"></path>
                    <text x="30" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#3B82F6">?</text>
                  </svg>
                  <div class="component-label">
                    <span class="font-bold">#{{ component.gatewayId }}</span> — {{ component.label }}
                  </div>
                </div>
              </div>

              <!-- ACTIVITY -->
              <div *ngSwitchCase="'activity'" class="activity-container" (click)="openInspector('activity', component)">
                <div *ngIf="component.type === 'task-user'" class="task task-user">
                  <svg width="100" height="60" viewBox="0 0 100 60">
                    <rect x="2" y="2" width="96" height="56" rx="5" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"></rect>
                    <svg x="10" y="15" width="20" height="20" viewBox="0 0 24 24">
                      <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" fill="#6366F1"></path>
                    </svg>
                    <text x="40" y="35" font-size="12" fill="#4338CA">Usuario</text>
                  </svg>
                  <div class="component-label">{{ component.label }}</div>
                </div>
              </div>

              <!-- edge: se omite la “bolita” visual -->
            </ng-container>

            <!-- Botón eliminar (para gateways/activities) -->
            <button
              class="delete-btn"
              (click)="$event.stopPropagation(); removeComponent(component.id)"
              title="Eliminar componente">×
            </button>
          </div>
        </div>
        <!-- Fin canvas -->
      </div>
    </main>

    <!-- Inspector lateral -->
    <aside class="fixed right-4 top-20 z-[200] w-[360px] max-w-[90vw]" *ngIf="inspectorOpen">
      <app-activity-panel
        *ngIf="inspectorKind === 'activity'"
        [activityId]="selectedActivityId"
        (close)="closeInspector()"
        (navigateTo)="navigateToPosition($event.x, $event.y)">
      </app-activity-panel>

      <app-edge-panel
        *ngIf="inspectorKind === 'edge'"
        [edgeId]="selectedEdgeId"
        (close)="closeInspector()">
      </app-edge-panel>

      <app-gateway-panel
        *ngIf="inspectorKind === 'gateway'"
        [gatewayId]="selectedGatewayId"
        (close)="closeInspector()"
        (navigateTo)="navigateToPosition($event.x, $event.y)">
      </app-gateway-panel>
    </aside>
  </div>
</div>

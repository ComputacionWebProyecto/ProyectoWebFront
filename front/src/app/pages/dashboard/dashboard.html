<!-- dashboard.html — merge final (pan con Shift, líneas de edges solo en SVG, sin “burbujas” de edge) -->
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <app-drop-menu
    [isOpen]="isSidebarOpen"
    (componentSelected)="onComponentSelected($event)">
  </app-drop-menu>

  <!-- Contenido principal -->
  <div class="flex-1 flex flex-col">
    <!-- Header fijo -->
    <app-header-dashboard
      [isSidebarOpen]="isSidebarOpen"
      (toggleSidebar)="toggleSidebar()"
      (toggleProcesses)="toggleProcessPanel()"
      (toggleUsers)="toggleUserPanel()"
      (toggleRoles)="onToggleRoles()">
    </app-header-dashboard>

    <!-- Paneles laterales -->
    <app-user-panel [isOpen]="isUserPanelOpen"></app-user-panel>
    <app-process-panel [isOpen]="isProcessPanelOpen"></app-process-panel>
    <app-role-panel [isOpen]="isRolePanelOpen"></app-role-panel>

    <!-- Contenido -->
    <main class="flex-1 overflow-hidden pt-16">
      <!-- Área del tablero -->
      <div
        class="board-area dashboard-container h-full w-full relative overflow-hidden"
        [class.shift-active]="isShiftPressed"
        (drop)="onBoardDrop($event)"
        (dragover)="onBoardDragOver($event)">

        <!-- Canvas movible -->
        <div class="board-canvas" [style.transform]="getCanvasTransform()">

          <!-- Capa SVG: SOLO líneas de edges -->
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" aria-hidden="true">
            <defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z"></path>
              </marker>
            </defs>

            <g *ngFor="let edgeCmp of boardComponents">
              <ng-container *ngIf="edgeCmp.category === 'edge'">
                <line
                  *ngIf="edgeCoordsByComponent(edgeCmp) as c"
                  [attr.x1]="c.x1" [attr.y1]="c.y1"
                  [attr.x2]="c.x2" [attr.y2]="c.y2"
                  stroke="#374151" stroke-width="2" stroke-opacity="0.9"
                  marker-end="url(#arrow)">
                </line>
              </ng-container>
            </g>
          </svg>
          <!-- Fin capa SVG -->

          <!-- Componentes (NO renderizamos edges como nodos) -->
          <div
            *ngFor="let component of boardComponents"
            class="board-component absolute"
            [style.left.px]="component.x"
            [style.top.px]="component.y"
            [attr.data-type]="component.type"
            [attr.draggable]="true"
            (dragstart)="onComponentDragStart($event, component)"
            (dragend)="onComponentDragEnd($event)">

            <ng-container [ngSwitch]="component.category">
              <!-- GATEWAY -->
              <div *ngSwitchCase="'gateway'" class="gateway-container">
                <div class="gateway gateway-decision">
                  <svg width="60" height="60" viewBox="0 0 60 60">
                    <path d="M30 5 L55 30 L30 55 L5 30 Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"></path>
                    <text x="30" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#3B82F6">?</text>
                  </svg>
                  <div class="component-label">{{ component.label }}</div>
                </div>
              </div>

              <!-- ACTIVITY -->
              <div *ngSwitchCase="'activity'" class="activity-container" (click)="openInspector('activity', component)">
                <div *ngIf="component.type === 'task-user'" class="task task-user">
                  <svg width="100" height="60" viewBox="0 0 100 60">
                    <rect x="2" y="2" width="96" height="56" rx="5" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"></rect>
                    <svg x="10" y="15" width="20" height="20" viewBox="0 0 24 24">
                      <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" fill="#6366F1"></path>
                    </svg>
                    <text x="40" y="35" font-size="12" fill="#4338CA">Usuario</text>
                  </svg>
                  <div class="component-label">{{ component.label }}</div>
                </div>
              </div>

              <!-- edge: se omite la “bolita” visual -->
            </ng-container>

            <!-- Botón eliminar (para gateways/activities) -->
            <button
              class="delete-btn"
              (click)="$event.stopPropagation(); removeComponent(component.id)"
              title="Eliminar componente">×
            </button>
          </div>
        </div>
        <!-- Fin canvas -->
      </div>
    </main>

    <!-- Inspector lateral -->
    <aside class="fixed right-4 top-20 z-[200] w-[360px] max-w-[90vw]" *ngIf="inspectorOpen">
      <app-activity-panel
        *ngIf="inspectorKind === 'activity'"
        [activityId]="selectedActivityId"
        (close)="closeInspector()">
      </app-activity-panel>

      <app-edge-panel
        *ngIf="inspectorKind === 'edge'"
        [edgeId]="selectedEdgeId"
        (close)="closeInspector()">
      </app-edge-panel>
    </aside>
  </div>
</div>

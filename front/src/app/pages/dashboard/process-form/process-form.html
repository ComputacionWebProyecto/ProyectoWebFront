<form class="space-y-6 pt-6">
  
  <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">
    Nuevo Proceso
  </h2>

  <div>
    <label class="block text-gray-700 font-medium">Nombre</label>
    <input [(ngModel)]="process.name" class="w-full border rounded-lg p-2 mt-1" placeholder="Enter process name" />
  </div>

  <div>
    <label class="block text-gray-700 font-medium">Descripción</label>
    <textarea [(ngModel)]="process.description" class="w-full border rounded-lg p-2 mt-1" rows="3"></textarea>
  </div>

  <div class="flex justify-end space-x-2">
    <button (click)="cancel()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg">Cancel</button>
    <button (click)="save()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Save</button>
  </div>

</form>

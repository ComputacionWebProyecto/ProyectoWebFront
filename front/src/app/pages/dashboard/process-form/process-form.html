<form class="space-y-6 pt-6" (ngSubmit)="save()">
  <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">
    {{ processData ? 'Editar Proceso' : 'Nuevo Proceso' }}
  </h2>

  <div>
    <label class="block text-gray-700 font-medium">Nombre</label>
    <input
      [(ngModel)]="process.name"
      name="name"
      class="w-full border rounded-lg p-2 mt-1"
      placeholder="Ingrese el nombre del proceso"
    />
  </div>

  <div>
    <label class="block text-gray-700 font-medium">Descripción</label>
    <textarea
      [(ngModel)]="process.description"
      name="description"
      class="w-full border rounded-lg p-2 mt-1"
      rows="3"
      placeholder="Ingrese una descripción"
    ></textarea>
  </div>

  <div class="flex justify-end space-x-2">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg"
    >
      Cancelar
    </button>
    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
      {{ processData ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</form>

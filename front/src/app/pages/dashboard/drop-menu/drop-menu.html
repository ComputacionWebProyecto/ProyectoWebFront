<!-- drop-menu.html -->
<aside 
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl transition-transform duration-300 ease-in-out z-40 border-r border-gray-200">
  
  <!-- Header del Sidebar (sin botón X) -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200">
    <h2 class="text-xl font-bold text-gray-800">Components</h2>
  </div>

  <!-- Items del menú -->
  <nav class="flex-1 overflow-y-auto p-4">
    <ul class="space-y-2">
      <li>
        <a 
          href="javascript:void(0)"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Dashboard</span>
        </a>
      </li>

      <li>
        <a 
          href="javascript:void(0)"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Perfil</span>
        </a>
      </li>

      <li>
        <a 
          href="javascript:void(0)"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Estadísticas</span>
        </a>
      </li>

      <li>
        <a 
          href="javascript:void(0)"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Configuración</span>
        </a>
      </li>
    </ul>

    <!-- Separador -->
    <hr class="my-4 border-gray-200">

    <!-- Cerrar sesión -->
    <ul class="space-y-2">
      <li>
        <a 
          href="javascript:void(0)"
          class="flex items-center p-3 rounded-lg hover:bg-red-50 transition-colors group">
          <svg class="w-5 h-5 text-red-500 group-hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="ml-3 text-red-600 group-hover:text-red-700 font-medium">Cerrar sesión</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<!-- Overlay para cerrar el sidebar en mobile -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden">
</div>

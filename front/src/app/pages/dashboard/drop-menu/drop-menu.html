<!-- drop-menu.html -->
<aside 
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl transition-transform duration-300 ease-in-out z-40 border-r border-gray-200">
  
  <!-- Header del Sidebar (sin botón X) -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200 mt-16">
    <h2 class="text-xl font-bold text-gray-800">Components</h2>
  </div>

  <!-- Items del menú -->
  <nav class="flex-1 overflow-y-auto p-4">
    <ul class="space-y-2">
      <!-- Dashboard -->
      <li>
        <a 
          href="Dashboard"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Dashboard</span>
        </a>
      </li>

      <!-- Activity (con submenú desplegable) -->
      <li>
        <button
          (click)="toggleTasks()"
          class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <div class="flex items-center">
            <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Activity</span>
          </div>
          <svg 
            class="w-4 h-4 text-gray-500 transition-transform duration-200"
            [class.rotate-90]="isTasksOpen"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <!-- Submenú de Actividad -->
        <ul 
          *ngIf="isTasksOpen" 
          class="ml-8 mt-2 space-y-1 border-l-2 border-gray-200 pl-3">
          <li>
            <button
              draggable="true"
              (dragstart)="onDragStart($event, 'task-user', 'activity')"
              (dragend)="onDragEnd($event)"
              (click)="onSelectComponent('task-user', 'activity')"
              class="w-full text-left flex items-center p-2 rounded-lg hover:bg-blue-50 transition-colors group cursor-move">
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span class="ml-2 text-sm text-gray-700 group-hover:text-blue-600">Tarea de Usuario</span>
            </button>
          </li>
        </ul>
      </li>

      <!-- Edge (con submenú desplegable) -->
      <li>
        <button
          (click)="toggleEvents()"
          class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <div class="flex items-center">
            <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            </svg>
            <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Edge</span>
          </div>
          <svg 
            class="w-4 h-4 text-gray-500 transition-transform duration-200"
            [class.rotate-90]="isEventsOpen"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <!-- Submenú de Eventos -->
        <ul 
          *ngIf="isEventsOpen" 
          class="ml-8 mt-2 space-y-1 border-l-2 border-gray-200 pl-3">
          <li>
            <button
              draggable="true"
              (dragstart)="onDragStart($event, 'event-start', 'edge')"
              (dragend)="onDragEnd($event)"
              (click)="onSelectComponent('event-start', 'edge')"
              class="w-full text-left flex items-center p-2 rounded-lg hover:bg-blue-50 transition-colors group cursor-move">
              <div class="w-4 h-4 rounded-full border-2 border-green-500"></div>
              <span class="ml-2 text-sm text-gray-700 group-hover:text-blue-600">Evento Inicio</span>
            </button>
          </li>
        </ul>
      </li>

      <!-- Gateway (con submenú desplegable) -->
      <li>
        <button
          (click)="toggleGateway()"
          class="w-full flex items-center justify-between p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <div class="flex items-center">
            <!-- Ícono de Gateway (rombo) -->
            <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l10 10-10 10L2 12 12 2z" />
            </svg>
            <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Gateway</span>
          </div>
          <!-- Flecha que rota -->
          <svg 
            class="w-4 h-4 text-gray-500 transition-transform duration-200"
            [class.rotate-90]="isGatewayOpen"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <!-- Submenú de Gateway -->
        <ul 
          *ngIf="isGatewayOpen" 
          class="ml-8 mt-2 space-y-1 border-l-2 border-gray-200 pl-3">
          
          <!-- Gateway de Decisión -->
          <li>
            <div 
              draggable="true"
              (dragstart)="onDragStart($event, 'decision-gateway', 'gateway')"
              (dragend)="onDragEnd($event)"
              (click)="onSelectComponent('decision-gateway', 'gateway')"
              class="flex items-center p-2 rounded-lg hover:bg-blue-50 transition-colors cursor-move group border-2 border-transparent hover:border-blue-300">
              <svg class="w-5 h-5 text-blue-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 12L12 22L22 12L12 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <text x="12" y="15" text-anchor="middle" font-size="12" fill="currentColor">?</text>
              </svg>
              <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium text-sm">Decisión</span>
            </div>
          </li>
        </ul>
      </li>

      <!-- Perfil -->
      <li>
        <a 
          href="Perfil"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Perfil</span>
        </a>
      </li>

      <!-- Configuración -->
      <li>
        <a 
          href="Configuracion"
          class="flex items-center p-3 rounded-lg hover:bg-gray-100 transition-colors group">
          <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="ml-3 text-gray-700 group-hover:text-blue-600 font-medium">Configuración</span>
        </a>
      </li>
    </ul>

    <!-- Separador -->
    <hr class="my-4 border-gray-200">

    <!-- Cerrar sesión -->
    <ul class="space-y-2">
      <li>
        <a 
          (click)="logout()"
          class="flex items-center p-3 rounded-lg hover:bg-red-50 transition-colors group">
          <svg class="w-5 h-5 text-red-500 group-hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="ml-3 text-red-600 group-hover:text-red-700 font-medium">Cerrar sesión</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<!-- Overlay para cerrar el sidebar en mobile -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden">
</div>

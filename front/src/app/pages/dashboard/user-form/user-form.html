<form class="space-y-6 pt-6" (ngSubmit)="save()">
  <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">Formulario Usuario</h2>

  <div>
    <label class="block text-gray-700 font-medium">Nombre</label>
    <input
      [(ngModel)]="user.nombre"
      name="nombre"
      required
      minlength="3"
      class="w-full border rounded-lg p-2 mt-1"
      placeholder="Ingrese el nombre del usuario"
    />
  </div>

  <div>
    <label class="block text-gray-700 font-medium">Correo</label>
    <input
      [(ngModel)]="user.correo"
      name="correo"
      type="email"
      required
      class="w-full border rounded-lg p-2 mt-1"
      placeholder="usuario@ejemplo.com"
    />
  </div>

  <div>
    <label class="block text-gray-700 font-medium">Contraseña</label>
    <input
      [(ngModel)]="user.contrasena"
      name="contrasena"
      type="password"
      required
      minlength="6"
      class="w-full border rounded-lg p-2 mt-1"
      placeholder="********"
    />
  </div>

  <div>
    <label class="block text-gray-700 font-medium">Rol</label>
    <select
      [(ngModel)]="user.roleId"
      name="rol"
      required
      class="w-full border rounded-lg p-2 mt-1 bg-white text-gray-800"
    >
      <option value="" disabled selected>Seleccione un rol</option>
      <option *ngFor="let rol of roles" [value]="rol.id">
        {{ rol.nombre }}
      </option>
    </select>
  </div>

  <div class="flex justify-end space-x-2">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg"
    >
      Cancelar
    </button>
    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
      {{ userData ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</form>

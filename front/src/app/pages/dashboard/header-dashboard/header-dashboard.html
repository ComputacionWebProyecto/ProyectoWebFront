<!-- header-dashboard.html -->
<header class="fixed top-0 left-0 w-full z-50 bg-gray-900 text-white flex items-center justify-between px-6 py-3 shadow-md">
  
  <!-- Lado Izquierdo: Botón Hamburguesa + Logo + Nombre -->
  <div class="flex items-center space-x-3">
    <!-- Botón con ícono de lápiz -->
    <button
      (click)="onToggleSidebar()"
      class="p-2 rounded-lg hover:bg-gray-800 transition-colors mr-2">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    </button>

    <img src="images/prueba.png" alt="Logo" class="w-10 h-10 rounded-full">
    <h1 class="text-xl font-semibold tracking-wide">404 NOT FOUND</h1>
  </div>

  
  <!-- Botones -->
  <div class="flex items-center space-x-4">
    <button
      class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-medium transition"
    >
      Users & Roles
    </button>

    <button
      class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition"
    >
      My Processes
    </button>
  </div>
</header>

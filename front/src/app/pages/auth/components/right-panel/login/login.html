<form #loginForm="ngForm" (ngSubmit)="submit()" class="w-full max-w-2xl mx-auto px-6 space-y-5 font-exo text-white">

  <div class="mb-5">
    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Correo electrónico</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      email
      [(ngModel)]="user.correo"
      #email="ngModel"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
             focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 
             dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
      placeholder="tu@correo.com"
    />
    @if (email.invalid && email.touched) {
      <p class="text-red-400 text-sm mt-1">
        @if (email.errors?.['required']) { El correo es obligatorio. }
        @else if (email.errors?.['email']) { Ingresa un correo válido. }
      </p>
    }
  </div>

  <div class="mb-5">
    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      [(ngModel)]="user.contrasena"
      #password="ngModel"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
             focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 
             dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
      placeholder="********"
    />
    @if (password.invalid && password.touched) {
      <p class="text-red-400 text-sm mt-1">La contraseña es obligatoria.</p>
    }
  </div>

  <div class="flex justify-center">
    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none 
             focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto 
             px-5 py-2.5 text-center disabled:bg-gray-500 dark:bg-blue-600 
             dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Iniciar sesión
    </button>
  </div>

  <div class="flex justify-center text-white">
  <a routerLink="/auth/registro" class="block text-sm text-blue-400 hover:underline cursor-pointer">
    ¿No tienes cuenta? Regístrate
  </a>
</div>
</form>

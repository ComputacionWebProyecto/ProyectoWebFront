<form (ngSubmit)= "submit()" class="w-full max-w-2xl mx-auto px-6 space-y-8 font-exo">
  <div class="mb-5">
    <label for="nit" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >NIT</label
    >
    <input
      type="text"
      id="nit"
      name="nit"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="123456789-0"
      required
      [(ngModel)] = "company.NIT"
    />
  </div>

  <div class="mb-5">
    <label for="companyName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Nombre de la compañía</label
    >
    <input
      type="text"
      id="companyName"
      name="companyName"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="El corral"
      required
      [(ngModel)] = "company.name"
    />
  </div>

  <div class="mb-5">
    <label for="contactEmail" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Correo de contacto</label
    >
    <input
      type="email"
      id="contactEmail"
      name="contactEmail"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="contacto@compania.com"
      required
      [(ngModel)] = "company.correoContacto"
    />
  </div>

  <div class="mb-5">
    <label for="adminName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Nombre del usuario administrador</label
    >
    <input
      type="text"
      id="adminName"
      name="adminName"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="Juan Carlos Hernández"
      required
    />
  </div>

  <div class="mb-5">
    <label for="adminEmail" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Correo del usuario administrador</label
    >
    <input
      type="email"
      id="adminEmail"
      name="adminEmail"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="admin@compania.com"
      required
    />
  </div>

  <div class="mb-5">
    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Contraseña</label
    >
    <input
      type="password"
      id="password"
      name="password"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      required
    />
  </div>
  <div class="flex justify-center">
    <button
      type="submit"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Crear cuenta
    </button>
  </div>
  <div class="flex justify-center text-white">
    <a routerLink="/recuperar" class="block text-sm text-blue-400 hover:underline cursor-pointer"
      >¿Ya tienes cuenta? Inicia sesión</a
    >
  </div>
</form>
